name: ClinDrift CI

on:
  push:
    branches:
      - main
      - paper/icaiae-2026-clindrift
      - masters/demo-hardening
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application
        run: |
          python -m py_compile app.py src/*.py

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Verify Streamlit starts
        run: |
          streamlit run app.py --server.headless=true --server.address=127.0.0.1 --server.port=8501 > streamlit.log 2>&1 &
          APP_PID=$!
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8501/_stcore/health"
          for _ in range(30):
              try:
                  body = urllib.request.urlopen(url, timeout=2).read().decode()
                  if "ok" in body.lower():
                      print(body)
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Streamlit health endpoint did not become ready")
          PY
          kill $APP_PID

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clindrift:ci .
